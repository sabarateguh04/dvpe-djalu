<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cek Status Laporan - DVPE Portal</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/portal/portal.css" />
  </head>
  <body>
    <div class="portal-shell" id="portalShell">
      <div class="portal-main" id="portalMain">
        <div class="portal-content" id="pageContent">
          <div class="dvpe-card pad" style="max-width:480px">
            <div class="card-title">Cek Status Laporan</div>
            <p class="text-muted small">Masukkan nomor laporan yang Anda terima saat mengirim laporan (contoh: DVPE-2026-A1B2C3).</p>
            <form id="form">
              <input class="dvpe-input" id="reportId" placeholder="DVPE-2026-XXXXXX" required />
              <button class="dvpe-btn dvpe-btn-primary" id="submitBtn" style="width:100%;margin-top:12px">Cek Status</button>
            </form>
            <div id="errorBox" class="dvpe-alert dvpe-alert-error hidden" style="margin-top:12px"></div>
            <div id="resultBox" class="dvpe-alert dvpe-alert-info hidden" style="margin-top:12px"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/portal/status.js"></script>
  </body>
</html>
