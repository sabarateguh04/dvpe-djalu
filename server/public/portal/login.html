<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Masuk - DVPE Portal</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/portal/portal.css" />
  </head>
  <body>
    <div class="portal-login-shell">
      <div class="login-card dvpe-card">
        <div class="login-brand">
          <div class="portal-brand-mark">🛡️</div>
          <div>
            <div class="login-brand-title">DVPE Portal</div>
            <div class="login-brand-sub">Pratinjau portal layanan masyarakat</div>
          </div>
        </div>

        <div class="dvpe-alert dvpe-alert-info" style="margin-bottom:16px">
          Mockup demo - gunakan kredensial: <strong>portal / portal</strong>
        </div>

        <form id="loginForm">
          <label class="field-label">Username</label>
          <input class="dvpe-input" id="username" autocomplete="username" required />
          <label class="field-label" style="margin-top:12px">Password</label>
          <input class="dvpe-input" id="password" type="password" autocomplete="current-password" required />

          <div id="errorBox" class="dvpe-alert dvpe-alert-error hidden" style="margin-top:12px"></div>

          <button class="dvpe-btn dvpe-btn-primary" id="submitBtn" style="width:100%;margin-top:18px">Masuk</button>
        </form>
        <div class="login-footnote">Di produksi, portal ini terbuka untuk publik tanpa login - gerbang ini hanya untuk pratinjau internal.</div>
      </div>
    </div>

    <script type="module" src="/portal/login.js"></script>
  </body>
</html>
